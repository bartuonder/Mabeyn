name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mabeyn
          POSTGRES_PASSWORD: mabeyn
          POSTGRES_DB: mabeyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mabeyn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mabeyn_app:mabeyn_app@localhost:5432/mabeyn
      ADMIN_DATABASE_URL: postgresql+asyncpg://mabeyn:mabeyn@localhost:5432/mabeyn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy mabeyn apps evals
      - run: uv run alembic upgrade head
      - run: uv run python -m mabeyn.agents.checkpoint
      - run: uv run pytest
