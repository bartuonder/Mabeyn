[project]
name = "mabeyn"
version = "0.1.0"
description = "A secure, multi-tenant agentic support layer between businesses and their customers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "langsmith>=0.14.16",
    "openai>=3.42.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
tracking = [
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mabeyn", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
