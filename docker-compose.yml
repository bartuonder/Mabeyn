services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mabeyn_app:mabeyn_app@postgres:5432/mabeyn
      REDIS_URL: redis://redis:6379/0
      TOOL_ALLOWED_HOSTS: kargoshop-mock
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CHAT_RATE_PER_CUSTOMER: ${CHAT_RATE_PER_CUSTOMER:-20}
      CHAT_RATE_PER_KEY: ${CHAT_RATE_PER_KEY:-300}
      CHAT_RATE_PER_TENANT: ${CHAT_RATE_PER_TENANT:-600}
      SESSION_RATE_PER_ADDRESS: ${SESSION_RATE_PER_ADDRESS:-20}
      SESSION_RATE_PER_KEY: ${SESSION_RATE_PER_KEY:-60}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  kargoshop-mock:
    build: .
    command: ["uvicorn", "apps.kargoshop_mock.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

  kargoshop-site:
    build: .
    command: ["uvicorn", "apps.kargoshop_site.main:app", "--host", "0.0.0.0", "--port", "9100"]
    ports:
      - "9100:9100"
    environment:
      MABEYN_API_URL: http://api:8000
      MABEYN_PUBLIC_API_URL: http://localhost:8000
      SHOP_API_URL: http://kargoshop-mock:9000
      SITE_ORIGIN: http://localhost:9100
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo-admin-password}
    depends_on:
      api:
        condition: service_healthy
      kargoshop-mock:
        condition: service_started

  admin:
    build: ./apps/admin
    ports:
      - "3100:3000"
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: .
    command: ["arq", "apps.worker.main.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://mabeyn_app:mabeyn_app@postgres:5432/mabeyn
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m mabeyn.agents.checkpoint && python -m mabeyn.memory.store"]
    environment:
      DATABASE_URL: postgresql+asyncpg://mabeyn_app:mabeyn_app@postgres:5432/mabeyn
      ADMIN_DATABASE_URL: postgresql+asyncpg://mabeyn:mabeyn@postgres:5432/mabeyn
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    profiles: ["seed"]
    command:
      - sh
      - -c
      - python -m mabeyn.cli seed-kargoshop --shop-url http://kargoshop-mock:9000 --password "$$DEMO_ADMIN_PASSWORD"
    environment:
      DATABASE_URL: postgresql+asyncpg://mabeyn_app:mabeyn_app@postgres:5432/mabeyn
      ADMIN_DATABASE_URL: postgresql+asyncpg://mabeyn:mabeyn@postgres:5432/mabeyn
      REDIS_URL: redis://redis:6379/0
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo-admin-password}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mabeyn
      POSTGRES_PASSWORD: mabeyn
      POSTGRES_DB: mabeyn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mabeyn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
